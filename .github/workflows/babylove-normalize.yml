name: Normalize BabyLove article evidence

on:
  push:
    branches: [main]
    paths:
      - 'src/content/articles/**'

permissions:
  contents: read

concurrency:
  group: babylove-normalize-main
  cancel-in-progress: false

jobs:
  normalize:
    if: startsWith(github.event.head_commit.message, 'Publish BabyLoveGrowth article ')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.BABYLOVE_PUBLISH_TOKEN }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Refresh governed editorial evidence
        run: npm run report:editorial-refresh
      - name: Commit the normalized evidence to main
        env:
          BABYLOVE_PUBLISH_TOKEN: ${{ secrets.BABYLOVE_PUBLISH_TOKEN }}
        run: |
          test -n "$BABYLOVE_PUBLISH_TOKEN"
          if git diff --quiet -- reports/editorial/editorial-refresh-queue.json; then
            echo "Editorial evidence is already current."
            exit 0
          fi
          git config user.name "Parent Coach Desk Editorial"
          git config user.email "parentcoachplaybook@gmail.com"
          git add -- reports/editorial/editorial-refresh-queue.json
          git commit -m "chore: normalize BabyLove editorial evidence"
          git push origin HEAD:main
