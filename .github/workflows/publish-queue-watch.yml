# Publish-queue watch: rebuild the site only when content is actually waiting.
#
# WHY THIS EXISTS. Under Cloudflare Pages a daily cron fired a deploy hook and
# the site rebuilt itself, so future-dated posts went live on their date with no
# human involved. The Pages-to-Workers cutover removed that hook and nothing
# replaced it (see worker-cron/src/index.ts). Nothing rebuilt the site on a
# schedule, and on 2026-07-28 the live homepage was a week stale while finished
# content sat unpublished. No monitor reported it.
#
# This is Option C from QUEUE.md: a daily drift check that dispatches a real
# deploy ONLY when the live site is genuinely missing content that main already
# carries. Option B (schedule the deploy unconditionally) was rejected because
# it would raise a production-approval prompt every single day, including the
# many days with nothing to ship, which trains people to approve without reading.
#
# WHAT THIS DOES NOT DO: it does not bypass the protected `production`
# environment. deploy-workers.yml still stops for a human approval. This turns
# "remember to ship" into "you have something to ship, here it is", which is the
# honest amount of automation available without removing that gate.
#
# It checks out MAIN deliberately. Drift against a feature branch is not
# actionable here: a deploy builds from main, so only main-versus-live matters.
# Content stranded on an unmerged branch is a PR problem, not a deploy problem,
# and this workflow says so rather than firing a deploy that would change nothing.

name: Publish queue watch

on:
  schedule:
    # 13:10 UTC daily, just after the old Pages hook's 13:00 slot.
    - cron: '10 13 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report drift but do not dispatch a deploy
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: write   # required to dispatch deploy-workers.yml

concurrency:
  group: pcd-publish-queue-watch
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Check whether the live site is missing content main already has
        id: drift
        run: |
          set +e
          node scripts/check-publish-queue-drift.mjs --json > drift.json
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e
          node -e '
            const d = require("./drift.json");
            const n = d.missingCount ?? 0;
            console.log(`missing: ${n}, unlisted-in-sitemap: ${d.unlistedCount ?? 0}`);
            for (const m of (d.missing ?? [])) {
              console.log(`  ${m.publishedAt}  ${m.waitingDays}d  ${m.collection}/${m.slug}`);
            }
          '
          node -e '
            const fs = require("fs");
            const d = require("./drift.json");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `missing=${d.missingCount ?? 0}\n`);
          '

      - name: Summarize
        run: |
          {
            echo "### Publish queue watch"
            echo ""
            if [ "${{ steps.drift.outputs.missing }}" = "0" ]; then
              echo "No drift. Everything eligible on \`main\` is reachable on the live site."
            else
              echo "**${{ steps.drift.outputs.missing }} entries** are eligible on \`main\` but not reachable live."
              echo ""
              echo "Dispatching a production deploy. It will stop at the protected \`production\` gate for approval."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch a deploy for main's current commit
        if: steps.drift.outputs.missing != '0' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA=$(git rev-parse HEAD)
          echo "Dispatching deploy-workers.yml for $SHA"
          gh workflow run deploy-workers.yml \
            --repo "${{ github.repository }}" \
            --ref main \
            --field commit_sha="$SHA"

      - name: Upload the drift report
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: publish-drift-${{ github.run_id }}
          path: drift.json
          if-no-files-found: warn
          retention-days: 14
